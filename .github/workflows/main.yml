name: Run Unit Tests
on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }} 
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            npm run test:main
          else
            echo "run testing"
          fi
  docker-image:
    runs-on: ubuntu-latest
    needs: test  
    if: github.ref == 'refs/heads/test' && success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Build the Docker image
        run: docker build -f Dockerfile --build-arg DATABASE_URL=${{ secrets.DATABASE_URL }} --build-arg SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }} -t ${{ secrets.DOCKERHUB_USERNAME }}/my-image-name:latest .
      - name: Push the image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-image-name:latest
